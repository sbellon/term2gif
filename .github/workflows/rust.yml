name: Rust

# Branches are checked through their pull request; pushes to other branches
# would only start the same jobs a second time.
on:
  push:
    branches: ["main"]
    paths-ignore: [".github/**"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Format
      run: cargo fmt --check
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Check
      run: cargo check --all-targets --all-features --verbose
  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Clippy
      run: cargo clippy --all-targets --all-features --verbose -- -D warnings
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: [format, check, clippy]
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: cargo build --verbose
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: [build]
    steps:
    - uses: actions/checkout@v7
    - name: Tests
      run: cargo test --all-features --verbose
  doc:
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
    - uses: actions/checkout@v7
    - name: Documentation
      run: cargo doc --no-deps --all-features --verbose
