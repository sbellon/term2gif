name: Rust

# Branches are checked through their pull request; pushes to other branches
# would only start the same jobs a second time.
on:
  push:
    branches: ["main"]
    paths-ignore: [".github/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# A new push to a pull request supersedes the run of its previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

# All jobs run in parallel, each building from scratch, so a run takes as long as
# its slowest job. clippy does everything `cargo check` does, and `cargo test`
# builds every target (including the binary, for the integration tests), so
# neither a separate check nor build job would catch anything more. `--locked`
# makes a Cargo.lock that is out of date fail instead of being updated.
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Format
      run: cargo fmt --check
  # Builds with the oldest Rust that `rust-version` in Cargo.toml promises.
  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install the minimum supported Rust version
      id: msrv
      shell: bash
      run: |
        msrv=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')
        rustup toolchain install "$msrv" --profile minimal
        echo "version=$msrv" >> "$GITHUB_OUTPUT"
    - name: Check
      run: cargo +${{ steps.msrv.outputs.version }} check --all-targets --all-features --locked --verbose
  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Clippy
      run: cargo clippy --all-targets --all-features --locked --verbose -- -D warnings
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Tests
      run: cargo test --all-features --locked --verbose
  doc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Documentation
      run: cargo doc --no-deps --all-features --locked --verbose
