version: 2
updates:
  # `/` covers the workflows in `.github/workflows`.
  - package-ecosystem: github-actions
    directory: /
    # A fixed time: without `day` and `time`, Dependabot runs at a time of
    # its own choosing, not necessarily once a week on the same day.
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: Europe/Berlin
    # New releases of the actions (which run with the workflows' permissions)
    # are only proposed after a week, when a hijacked one has usually been
    # noticed and pulled. The project's own dependencies have no cooldown set,
    # but Dependabot still holds back their new releases for about three days;
    # only security updates arrive right away.
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    assignees:
      - sbellon
    # One pull request for all pending updates instead of one per action.
    groups:
      actions:
        patterns:
          - "*"

  # Updates `Cargo.lock` (and `Cargo.toml` only where a new release falls
  # outside the declared range); with `all` also the transitive dependencies,
  # like `cargo update`.
  - package-ecosystem: cargo
    directory: /
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: deps
    assignees:
      - sbellon
    groups:
      rust:
        patterns:
          - "*"
