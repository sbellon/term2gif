version: 2
updates:
  # `/` covers the workflows in `.github/workflows`.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Releases are only proposed after a week, when a hijacked one has
    # usually been noticed and pulled.
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    assignees:
      - sbellon
    # One pull request for all pending updates instead of one per action.
    groups:
      actions:
        patterns:
          - "*"

  # Updates `Cargo.lock` (and `Cargo.toml` only where a new release falls
  # outside the declared range); with `all` also the transitive dependencies,
  # like `cargo update`.
  - package-ecosystem: cargo
    directory: /
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    assignees:
      - sbellon
    groups:
      rust:
        patterns:
          - "*"
